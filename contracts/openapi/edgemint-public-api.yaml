components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.edgemint.example/oauth/token
          scopes:
            tasks:read: Read tasks
            tasks:write: Create tasks
            billing:read: Read billing
            admin: Workspace administration
    ApiKey:
      type: apiKey
      in: header
      name: X-EdgeMint-Key
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,80}$
        detail:
          type: string
        requestId:
          type: string
        traceId:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - message
            properties:
              path:
                type: string
              message:
                type: string
              code:
                type: string
        instance:
          type: string
          format: uri-reference
    Money:
      type: object
      additionalProperties: false
      required:
      - amountMicros
      - currency
      properties:
        amountMicros:
          $ref: '#/components/schemas/Int64String'
        currency:
          type: string
          enum:
          - EUR
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - limit
      - hasMore
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
    TaskInput:
      oneOf:
      - $ref: '#/components/schemas/FileTaskInput'
      - $ref: '#/components/schemas/InlineTaskInput'
    TaskConfiguration:
      oneOf:
      - $ref: '#/components/schemas/DocumentOcrConfiguration'
      - $ref: '#/components/schemas/DocumentExtractConfiguration'
      - $ref: '#/components/schemas/AudioTranscribeConfiguration'
    CreateTaskRequest:
      oneOf:
      - $ref: '#/components/schemas/DocumentOcrTaskRequest'
      - $ref: '#/components/schemas/DocumentExtractTaskRequest'
      - $ref: '#/components/schemas/AudioTranscribeTaskRequest'
      discriminator:
        propertyName: taskType
        mapping:
          document-ocr: '#/components/schemas/DocumentOcrTaskRequest'
          document-extract: '#/components/schemas/DocumentExtractTaskRequest'
          audio-transcribe: '#/components/schemas/AudioTranscribeTaskRequest'
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - workspaceId
      - taskType
      - currentRevisionId
      - createdAt
      - version
      - lifecycleStatus
      - executionStatus
      - billingStatus
      properties:
        id:
          type: string
        workspaceId:
          type: string
        taskType:
          type: string
        currentRevisionId:
          type: string
        resultId:
          type:
          - string
          - 'null'
        estimatedCost:
          $ref: '#/components/schemas/Money'
        finalCost:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          $ref: '#/components/schemas/Int64String'
        lifecycleStatus:
          type: string
          enum:
          - draft
          - submitted
          - active
          - completed
          - failed
          - cancelled
          - expired
          - disputed
        executionStatus:
          type: string
          enum:
          - not_scheduled
          - queued
          - matching
          - leased
          - running
          - result_submitted
          - verifying
          - succeeded
          - failed
          - abandoned
          - expired
        billingStatus:
          type: string
          enum:
          - not_reserved
          - reserving
          - reserved
          - charged
          - released
          - failed
          - disputed
        currentAttemptId:
          type:
          - string
          - 'null'
    CreateRevisionRequest:
      type: object
      additionalProperties: false
      required:
      - changeReason
      - input
      - configuration
      properties:
        changeReason:
          type: string
          minLength: 3
          maxLength: 1000
        input:
          $ref: '#/components/schemas/TaskInput'
        configuration:
          $ref: '#/components/schemas/TaskConfiguration'
    QuoteRequest:
      $ref: '#/components/schemas/CreateTaskRequest'
    Quote:
      type: object
      required:
      - id
      - expiresAt
      - price
      - priceBookVersion
      - breakdown
      properties:
        id:
          type: string
        expiresAt:
          type: string
          format: date-time
        price:
          $ref: '#/components/schemas/Money'
        priceBookVersion:
          type: string
        breakdown:
          type: array
          items:
            type: object
            required:
            - code
            - amountMicros
            properties:
              code:
                type: string
              amountMicros:
                type: integer
    UploadIntent:
      type: object
      required:
      - workspaceId
      - fileName
      - contentType
      - sizeBytes
      - sha256
      properties:
        workspaceId:
          type: string
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    FileRecord:
      type: object
      required:
      - id
      - status
      - sizeBytes
      - sha256
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - pending_upload
          - uploaded
          - scanning
          - ready
          - rejected
          - deleted
        sizeBytes:
          type: integer
        sha256:
          type: string
        uploadUrl:
          type:
          - string
          - 'null'
          format: uri
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    Workspace:
      type: object
      required:
      - id
      - organizationId
      - name
      - environment
      - version
      properties:
        id:
          type: string
        organizationId:
          type: string
        name:
          type: string
        environment:
          type: string
          enum:
          - development
          - staging
          - production
        version:
          type: integer
    ApiKeyCreateRequest:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
        scopes:
          type: array
          minItems: 1
          items:
            type: string
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        allowedCidrs:
          type: array
          items:
            type: string
    ApiKeyCreated:
      type: object
      required:
      - id
      - secret
      - prefix
      - createdAt
      properties:
        id:
          type: string
        secret:
          type: string
          description: Shown exactly once
        prefix:
          type: string
        createdAt:
          type: string
          format: date-time
    WebhookEndpoint:
      type: object
      required:
      - id
      - url
      - events
      - enabled
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
          pattern: ^https://
        events:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        secretLastFour:
          type: string
    Subscription:
      type: object
      required:
      - id
      - plan
      - status
      - currentPeriodEnd
      properties:
        id:
          type: string
        plan:
          type: string
          enum:
          - developer
          - growth
          - business
          - enterprise
        status:
          type: string
          enum:
          - trialing
          - active
          - past_due
          - suspended
          - cancelled
        currentPeriodEnd:
          type: string
