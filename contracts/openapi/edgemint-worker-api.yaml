          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeviceChallengeResponse'
          headers:
            X-Request-Id:
              schema:
                type: string
            X-RateLimit-Limit:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                minimum: 0
            X-RateLimit-Reset:
              schema:
                type: integer
                minimum: 0
              description: Unix epoch seconds.
        '400':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
