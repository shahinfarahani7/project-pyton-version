openapi: 3.1.0
info:
  title: EdgeMint Mobile Worker API
  version: 2.1.0
  description: Normative worker protocol. Assignments are server-auto-leased with no per-task worker confirmation. Lease token
    plus monotonic fence token prevents stale completion; WebSocket ACK is transport receipt only.
servers:
- url: https://worker.edgemint.example/v1
tags:
- name: registration
- name: health
- name: assignments
- name: models
- name: rewards
- name: preferences
