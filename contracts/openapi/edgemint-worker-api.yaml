components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,80}$
        detail:
          type: string
        requestId:
          type: string
        traceId:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - message
            properties:
              path:
                type: string
              message:
                type: string
              code:
                type: string
        instance:
          type: string
          format: uri-reference
    Challenge:
      type: object
      required:
      - challengeId
      - nonce
      - expiresAt
      properties:
        challengeId:
          type: string
        nonce:
          type: string
        expiresAt:
          type: string
          format: date-time
    DeviceRegistration:
      type: object
      additionalProperties: false
      required:
      - installationId
      - platform
      - appVersion
      - capabilities
      - attestation
      properties:
        installationId:
          type: string
        platform:
          type: string
          enum:
          - android
          - ios
          - linux_edge
        appVersion:
          type: string
        capabilities:
          type: object
        attestation:
          type: object
        publicKey:
          type: string
    WorkerSession:
      type: object
      required:
      - workerId
      - deviceId
      - accessToken
      - expiresAt
      properties:
        workerId:
          type: string
        deviceId:
          type: string
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        heartbeatIntervalSeconds:
          type: integer
    Heartbeat:
      type: object
      required:
      - sequence
      - observedAt
      - batteryBps
      - charging
      - thermalState
      - freeRamBytes
      - freeStorageBytes
      - network
      - currentLeases
      - installedModels
      properties:
        sequence:
          type: integer
          minimum: 1
        observedAt:
          type: string
          format: date-time
        batteryBps:
          type: integer
          minimum: 0
          maximum: 10000
        charging:
          type: boolean
        thermalState:
          type: string
          enum:
          - nominal
          - fair
          - serious
          - critical
        freeRamBytes:
          type: integer
          minimum: 0
        freeStorageBytes:
          type: integer
          minimum: 0
        network:
          type: string
          enum:
          - offline
          - cellular
          - wifi
          - ethernet
        currentLeases:
          type: array
          items:
            type: string
        installedModels:
          type: array
          items:
            type: object
            required:
            - modelVersionId
            - artifactSha256
            properties:
              modelVersionId:
                type: string
              artifactSha256:
                type: string
    Assignment:
      type: object
      required:
      - assignmentId
      - attemptId
      - revisionId
      - leaseToken
      - fenceToken
      - leaseExpiresAt
      - taskType
      - modelVersionId
      - inputManifestUrl
      - outputUploadUrl
      - assignmentMode
      - executionStartsAutomatically
      - startDeadlineAt
      properties:
        assignmentId:
          type: string
        attemptId:
          type: string
        revisionId:
          type: string
        leaseToken:
          type: string
        fenceToken:
          $ref: '#/components/schemas/Int64String'
        leaseExpiresAt:
          type: string
          format: date-time
        taskType:
          type: string
        modelVersionId:
          type: string
        inputManifestUrl:
          type: string
          format: uri
        outputUploadUrl:
          type: string
          format: uri
        executionLimits:
          type: object
        assignmentMode:
          type: string
          const: auto
        executionStartsAutomatically:
          type: boolean
          const: true
        startDeadlineAt:
          type: string
          format: date-time
    Progress:
      type: object
      required:
      - leaseToken
      - fenceToken
      - sequence
      - stage
      - progressBps
      properties:
        leaseToken:
          type: string
        fenceToken:
          type: integer
        sequence:
          type: integer
        stage:
          type: string
        progressBps:
          type: integer
          minimum: 0
          maximum: 10000
        metrics:
          type: object
    Checkpoint:
      type: object
      required:
      - leaseToken
      - fenceToken
      - sequence
      - modelVersionId
      - inputSha256
      - checkpointSha256
      - encryptedBlobRef
      properties:
        leaseToken:
          type: string
        fenceToken:
          type: integer
        sequence:
          type: integer
        modelVersionId:
          type: string
        inputSha256:
          type: string
        checkpointSha256:
          type: string
        encryptedBlobRef:
          type: string
    Completion:
      type: object
      required:
      - leaseToken
      - fenceToken
      - resultSha256
      - outputArtifactId
      - outputInline
      - metrics
      - signature
      properties:
        leaseToken:
          type: string
        fenceToken:
          type: integer
        resultSha256:
          type: string
        outputArtifactId:
          type: string
        outputInline:
          type: string
          minLength: 1
          maxLength: 2097152
        metrics:
          type: object
        signature:
          type: string
    PublicId:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,31}_[0-9A-HJKMNP-TV-Z]{26}$
      example: task_01JZ7M4J6QXW7YSF1DQ9Q32N5Z
    Int64String:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)$
      example: '2500000'
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - limit
      - hasMore
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
      - operationId
      - accepted
      - status
      - occurredAt
      properties:
        operationId:
          type: string
          minLength: 1
        accepted:
          type: boolean
        resourceId:
          $ref: '#/components/schemas/PublicId'
        status:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          minLength: 1
    CreateDeviceChallengeResponse:
      type: object
      additionalProperties: false
      properties:
        challengeId:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
      required:
      - challengeId
      - nonce
      - expiresAt
    RegisterWorkerDeviceResponse:
      type: object
      additionalProperties: false
      properties:
        workerId:
          type: string
          minLength: 1
        deviceId:
          type: string
          minLength: 1
        accessToken:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
      required:
      - workerId
      - deviceId
      - accessToken
      - expiresAt
    RefreshWorkerSessionResponse:
      type: object
      additionalProperties: false
      properties:
        workerId:
          type: string
          minLength: 1
        deviceId:
          type: string
          minLength: 1
        accessToken:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
      required:
      - workerId
      - deviceId
      - accessToken
      - expiresAt
    SubmitBenchmarkRequest:
      type: object
      additionalProperties: false
      required:
      - suiteVersion
      - measuredAt
      - results
      - signature
      properties:
        suiteVersion:
          type: string
        measuredAt:
          type: string
          format: date-time
        results:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - metric
            - value
            - unit
            properties:
              metric:
                type: string
              value:
                type: number
              unit:
                type: string
        signature:
          type: string
          contentEncoding: base64
    SubmitBenchmarkResponse:
      $ref: '#/components/schemas/CommandReceipt'
    SendHeartbeatResponse:
      $ref: '#/components/schemas/CommandReceipt'
    GetNextAssignmentResponse:
      type: object
      additionalProperties: false
      properties:
        assignmentId:
          type: string
          minLength: 1
        attemptId:
          type: string
          minLength: 1
        revisionId:
          type: string
          minLength: 1
        leaseToken:
          type: string
          minLength: 1
        fenceToken:
          type: integer
        leaseExpiresAt:
          type: string
          format: date-time
        taskType:
          type: string
          minLength: 1
        modelVersionId:
          type: string
          minLength: 1
        inputManifestUrl:
          type: string
          minLength: 1
        outputUploadUrl:
          type: string
          minLength: 1
        assignmentMode:
          type: string
          const: auto
        executionStartsAutomatically:
          type: boolean
          const: true
        startDeadlineAt:
          type: string
          format: date-time
      required:
      - assignmentId
      - attemptId
      - revisionId
      - leaseToken
      - fenceToken
      - leaseExpiresAt
      - taskType
      - modelVersionId
      - inputManifestUrl
      - outputUploadUrl
      - assignmentMode
      - executionStartsAutomatically
      - startDeadlineAt
    RenewAssignmentResponse:
      $ref: '#/components/schemas/CommandReceipt'
    ProgressAssignmentResponse:
      $ref: '#/components/schemas/CommandReceipt'
    CheckpointAssignmentResponse:
