      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/PublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
      x-edgemint-owner: task
      x-edgemint-contract-version: 5.0.0
      description: Route task using active routing policy and quote constraints This operation enforces tenant scope, authorization,
        idempotency where applicable, structured Problem responses, audit requirements, and optimistic concurrency defined
        by the canonical OperationContract.
components:
  securitySchemes:
    OpsOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.edgemint.example/authorize
          tokenUrl: https://auth.edgemint.example/token
          scopes:
            ops: Operations access
            finance: Finance access
            security: Security access
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
      - type
      - title
      - status
      - code
      - traceId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,80}$
        detail:
          type: string
        requestId:
          type: string
        traceId:
          type: string
          minLength: 1
        retryable:
          type: boolean
          default: false
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - path
            - message
            properties:
              path:
                type: string
              message:
                type: string
              code:
                type: string
        instance:
          type: string
          format: uri-reference
    OperatorAction:
      type: object
      required:
      - reason
      - ticketId
      properties:
        reason:
          type: string
          minLength: 10
        ticketId:
          type: string
        expectedVersion:
          type: integer
    PublicId:
      type: string
      pattern: ^[a-z][a-z0-9_]{1,31}_[0-9A-HJKMNP-TV-Z]{26}$
      example: task_01JZ7M4J6QXW7YSF1DQ9Q32N5Z
    Int64String:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)$
      example: '2500000'
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - limit
      - hasMore
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
      - operationId
      - accepted
      - status
      - occurredAt
      properties:
        operationId:
          type: string
          minLength: 1
        accepted:
          type: boolean
        resourceId:
          $ref: '#/components/schemas/PublicId'
        status:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
          minLength: 1
    TaskSummary:
      type: object
      additionalProperties: false
      properties: &id002
        id:
          $ref: '#/components/schemas/PublicId'
        workspaceId:
          $ref: '#/components/schemas/PublicId'
        taskType:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - draft
          - submitted
          - active
          - completed
          - failed
          - cancelled
          - expired
          - disputed
