asyncapi: 3.0.0
info:
  title: EdgeMint Domain Events
  version: 5.0.0
  description: Normative at-least-once CloudEvents contract. Generated one-to-one from EventCatalog; producers use transactional
    outbox and consumers use inbox deduplication.
defaultContentType: application/cloudevents+json
servers:
  production:
    host: ${EVENT_RELAY_HOST}
    pathname: /events/v1
    protocol: wss
    description: EdgeMint durable WebSocket Event Relay. PostgreSQL is the event durability authority.
channels:
  api_key_created:
    address: /events/v1/api_key_created
