apiVersion: edgemint.io/v1
kind: CanonicalDecisionSet
metadata:
  name: edgemint-production-v5
  version: 5.0.0
  status: active
  effectiveDate: '2026-07-21'
spec:
  scope:
    ga1:
    - customer-api
    - operations-api
    - android-worker
    - ios-companion
    - customer-portal
    - operations-portal
    - ocr
    - document-extraction
    - transcription
    - eur-credits
    - eur-worker-rewards
    excluded:
    - public-token-sale
    - on-chain-per-task-settlement
    - unattended-ios-paid-inference
  platform:
    backend: Python 3.13.14, FastAPI 0.140.0, Pydantic 2.13.4, SQLAlchemy 2.0.51 and
      psycopg 3
    database: PostgreSQL 18 only
    realtimeTransport: Secure WebSocket only
    durableEventStore: PostgreSQL transactional outbox, inbox, delivery, acknowledgement,
      replay and dead-letter tables
    objectStorage: Amazon S3
    mobile: Flutter 3.44 stable
    web: Node.js 24 LTS plus React and TypeScript
    containerOrchestrator: Amazon EKS
    infrastructureAsCode: Terraform plus Helm
  cloud:
    provider: AWS
    primaryRegion: eu-central-1
    drRegion: eu-west-1
    availabilityZones: 3
    databaseService: Amazon RDS for PostgreSQL 18, Multi-AZ
    dataResidency: workspace policy bound to storage, database, event delivery, and
      worker routing
    postgresqlEngineVersion: 18.4 audited baseline; exact production minor is an approved
      release input
  identity:
    customerAndOperator: Amazon Cognito OIDC
    operatorMfa: required phishing-resistant MFA
    serviceIdentity: AWS IAM Roles for Service Accounts plus mTLS
    workerIdentity: device-bound P-256 key plus Google Play Integrity or Apple App
      Attest
  payments:
    billing: Stripe Billing
    tax: Stripe Tax
    kyc: Stripe Identity and Stripe Connect
    payout: Stripe Connect Express
    unsupportedCountryBehavior: worker earning disabled; no manual bypass
  token:
    enabled: false
    reason: outside GA1; EUR reward liabilities and regulated fiat payout rails only
  mobileExecution:
    android: foreground service or user-approved charging schedule with visible persistent
      status
    ios: foreground execution and OS-granted BGProcessingTask only; no guaranteed
      background work
  identifiers:
    database: UUIDv7 generated by PostgreSQL uuidv7()
    public: opaque type-prefixed ULID
    request: type-prefixed ULID
  money:
    currency: EUR
    precision: integer micro-EUR
    rounding: HALF_UP
    minimumExpectedContributionMarginBps: 2500
    minimumStressedContributionMarginBps: 1500
  tenancy:
    customerIsolation: workspace
    organizationResources: organization
    databaseEnforcement: PostgreSQL FORCE ROW LEVEL SECURITY using transaction-local
      app.workspace_id policies
    serviceEnforcement: workspace claim plus authorization policy
  events:
    format: CloudEvents 1.0 JSON
    transport: wss
    endpoint: /events/v1
    delivery: at-least-once
    durableAuthority: PostgreSQL
    ordering: monotonic sequence per aggregate
    acknowledgement: consumer acknowledges only after local transaction commit
    reconnect: resume token plus last acknowledged sequence
    maxFrameBytes: 1048576
    maxInFlightPerConnection: 256
    heartbeatSeconds: 20
    acknowledgementTimeoutSeconds: 30
    retentionDays: 30
    deadLetterRetentionDays: 90
  release:
    strategy: progressive canary
    stages:
    - internal
    - 1-percent
    - 5-percent
    - 25-percent
    - 100-percent
    automaticRollback: true
    requiredEvidence:
    - build
    - unit
    - integration
    - contract
    - e2e
    - load
    - soak
    - chaos
    - security
    - sbom
    - signature
    - backup-restore
    - dr
    - legal
    - finance
  slo:
    publicApiAvailability: 99.95%
    eventRelayAvailability: 99.95%
    workerGatewayAvailability: 99.95%
    operationsApiAvailability: 99.9%
    taskAdmissionP95Ms: 500
    websocketPublishToDeliveryP95Ms: 500
    workerHeartbeatP95Ms: 250
    rpoMinutes: 5
    rtoMinutes: 60
  assignmentProtocol:
    mode: server_auto_lease
    workerOptInAuthority: current_consent_and_available_status
    perTaskWorkerConfirmation: false
    perTaskAcceptRejectApiAllowed: false
    deliveryAcknowledgementMeaning: transport_receipt_only
    startBehavior: worker_agent_starts_automatically_after_signature_lease_fence_and_resource_validation
    localPreflightFailure: agent_reports_machine_detected_unavailability_and_server_reassigns_with_new_fence
    manualWorkerChoice: availability_toggle_only_before_assignment
    availabilityChangeEffect: future_assignments_only_active_leases_continue
