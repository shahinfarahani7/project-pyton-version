{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: edgemint }
  annotations:
    eks.amazonaws.com/role-arn: {{ required (printf "irsaRoles.%s is required" $name) (index $.Values.irsaRoles $name) | quote }}
automountServiceAccountToken: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: edgemint }
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: 10
  minReadySeconds: 10
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: edgemint }
      annotations: { checksum/config: {{ toJson $.Values.global | sha256sum | quote }} }
    spec:
      serviceAccountName: {{ $name }}
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
      containers:
        - name: app
          image: "{{ $.Values.global.imageRegistry }}/{{ $service.image.repository }}@{{ required (printf "services.%s.image.digest is required" $name) $service.image.digest }}"
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080, protocol: TCP }]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: {{ $.Values.global.environment | quote }} }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ $.Values.global.otelEndpoint | quote }} }
            - { name: SERVICE_NAME, value: {{ $name | quote }} }
          {{- if and $service.secretKeys (gt (len $service.secretKeys) 0) }}
          envFrom:
            - secretRef: { name: edgemint-{{ $name }} }
          {{- end }}
          startupProbe: { httpGet: { path: /health/live, port: http }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, failureThreshold: 3, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, failureThreshold: 3, periodSeconds: 15, timeoutSeconds: 3 }
          lifecycle: { preStop: { exec: { command: ["/bin/sh", "-c", "sleep 15"] } } }
          resources: {{ toYaml $service.resources | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }}, labels: { app.kubernetes.io/name: {{ $name }} } }
spec: { selector: { app.kubernetes.io/name: {{ $name }} }, ports: [{ name: http, port: 80, targetPort: http }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: {{ $name }} }
spec: { maxUnavailable: {{ $service.pdb.maxUnavailable }}, selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ $name }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $service.autoscaling.minReplicas }}
  maxReplicas: {{ $service.autoscaling.maxReplicas }}
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 }, scaleUp: { stabilizationWindowSeconds: 30 } }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $service.autoscaling.cpuTarget }} } }
---
{{- end }}
{{- end }}
