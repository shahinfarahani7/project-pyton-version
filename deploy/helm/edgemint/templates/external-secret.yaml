{{- if .Values.externalSecrets.enabled }}
{{- range $name, $service := .Values.services }}
{{- if and $service.enabled $service.secretKeys (gt (len $service.secretKeys) 0) }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: edgemint-{{ $name }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: edgemint }
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.storeName }}
    kind: {{ $.Values.externalSecrets.storeKind }}
  target:
    name: edgemint-{{ $name }}
    creationPolicy: Owner
  dataFrom:
  {{- range $key := $service.secretKeys }}
    - extract:
        key: {{ required (printf "externalSecrets.keys.%s is required" $key) (index $.Values.externalSecrets.keys $key) }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
