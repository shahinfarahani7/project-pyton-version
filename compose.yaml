name: edgemint

networks:
  edgemint:
    name: edgemint

services:
  postgresql:
    image: ${POSTGRES_DEV_IMAGE:-postgres:18-bookworm}
    networks: [edgemint]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edgemint}
      POSTGRES_USER: ${POSTGRES_USER:-edgemint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong local-only secret}
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    command: ["postgres", "-c", "ssl=off", "-c", "max_connections=300", "-c", "log_min_duration_statement=500"]
    volumes: ["postgresql-data:/var/lib/postgresql"]
  postgresql-init:
    image: ${POSTGRES_TOOLS_IMAGE:-postgres:18-bookworm}
    networks: [edgemint]
    depends_on: { postgresql: { condition: service_healthy } }
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_USER: ${POSTGRES_USER:-edgemint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-edgemint}
    volumes:
      - ./database/sql:/migrations:ro
      - ./tools/run_postgresql_migrations.sh:/run-migrations.sh:ro
    entrypoint: ["/bin/bash", "/run-migrations.sh"]
    restart: "no"
  postgresql-seed:
    image: ${POSTGRES_TOOLS_IMAGE:-postgres:18-bookworm}
    networks: [edgemint]
    depends_on:
      postgresql-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_USER: ${POSTGRES_USER:-edgemint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-edgemint}
    volumes:
      - ./database/seed:/seed:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -eu
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -X -v ON_ERROR_STOP=1 -h "$$POSTGRES_HOST" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /seed/dev_mock_data.sql
        echo DEV_SEED_APPLIED
    restart: "no"
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    networks: [edgemint]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: edgemint
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}
    networks: [edgemint]
    ports: ["1025:1025", "8025:8025"]

volumes:
  postgresql-data: {}
