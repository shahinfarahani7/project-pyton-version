[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "edgemint-backend"
version = "5.0.0"
description = "EdgeMint Python/FastAPI backend services"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.140.0",
  "uvicorn[standard]==0.51.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.12.0",
  "sqlalchemy==2.0.51",
  "psycopg[binary,pool]==3.3.4",
  "alembic==1.18.5",
  "PyJWT[crypto]==2.13.0",
  "cryptography==46.0.4",
  "orjson==3.11.9",
  "httpx==0.28.1",
  "python-multipart==0.0.20"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "coverage==7.13.1",
  "ruff==0.14.14",
  "mypy==1.19.1",
  "types-PyYAML==6.0.12.20250915"
]

[tool.hatch.build.targets.wheel]
packages = ["edgemint"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 110
src = ["edgemint", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
