server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: resolve per request so recreated backend containers are found at their new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $operations_upstream http://operations:8080;
    set $api_gateway_upstream http://api-gateway:8080;

    location /internal/ {
        proxy_pass $operations_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin sign-in uses the same /auth endpoints as the customer portal (CSP allows same origin only).
    location /auth/ {
        proxy_pass $api_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
