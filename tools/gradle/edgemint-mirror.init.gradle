// Maven mirrors for blocked networks. Flutter SDK settings are patched via tools/setup_gradle_mirror.ps1.

gradle.beforeProject { project ->
    if (project.name == 'jni') {
        project.pluginManager.apply('org.jetbrains.kotlin.android')
    }
    if (project.name in ['jni', 'jni_flutter']) {
        project.afterEvaluate {
            project.android.compileSdk = 36
        }
    }
}

allprojects {
    buildscript {
        repositories {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.myket.ir' }
            google()
            mavenCentral()
        }
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.myket.ir' }
        google()
        mavenCentral()
    }
}
