apiVersion: edgemint.io/v1
kind: PromotionPolicy
metadata:
  name: model-adoption
  version: 2.0.0
  status: evaluation
  owners:
  - growth
  - finance
  - fraud
  labels:
    productionActivation: requires-finance-approval
spec:
  budget:
    unit: EUR_MICROS
    amountMicros: 10000000000
    owner: growth
    hardStop: true
  eligibilityRules:
  - account_not_flagged
  - campaign_window_active
  benefit:
    type: task_discount
    value: 2000
  caps:
    perAccountDailyMicros: 1000000
    globalBudgetHardStop: true
  antiAbuse:
  - device_attestation
  - account_velocity
  - linked_identity_check
  fundsFloorDifference: true
  killSwitch:
    automaticFraudRateBps: 300
