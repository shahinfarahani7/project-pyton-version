apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-100-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-100
  useCaseRef: UseCase/uc-050-verify-ocr-result@2.0.0
  mode: failure
  given:
  - Use case UC-050 policy dependencies are active and their hashes are pinned for the request.
  - Actor Verification Service is authenticated and has permissions ops.operations:write.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke forceVerifyTask with the deterministic precondition that produces VERIFICATION_DISAGREEMENT.
  then:
  - The API returns canonical error code VERIFICATION_DISAGREEMENT with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Verification Service
    operationIds:
    - forceVerifyTask
    requirements:
    - REQ-VERIFY-003
    - REQ-FRAUD-003
  expectedEvents: []
  expectedErrorCode: VERIFICATION_DISAGREEMENT
