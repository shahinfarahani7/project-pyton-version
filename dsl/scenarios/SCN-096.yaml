  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Treasury Operator
    operationIds:
    - resolveClaimTransfer
    requirements:
    - REQ-CLAIM-004
    - REQ-DISPUTE-004
  expectedEvents: []
