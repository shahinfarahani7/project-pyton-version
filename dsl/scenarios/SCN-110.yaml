  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-110
  useCaseRef: UseCase/uc-055-trace-critical-flow@2.0.0
  mode: failure
  given:
  - Use case UC-055 policy dependencies are active and their hashes are pinned for the request.
  - Actor SRE is authenticated and has permissions control:observability.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
