  owners:
  - qa
spec:
  id: SCN-088
  useCaseRef: UseCase/uc-044-reconcile-task-financials@2.0.0
  mode: failure
  given:
  - Use case UC-044 policy dependencies are active and their hashes are pinned for the request.
