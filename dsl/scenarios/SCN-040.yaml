apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-040-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-040
  useCaseRef: UseCase/uc-020-review-balance@2.0.0
  mode: failure
  given:
  - Use case UC-020 policy dependencies are active and their hashes are pinned for the request.
  - Actor Billing Manager is authenticated and has permissions customer.billing:read.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke getCreditBalance with the deterministic precondition that produces INPUT_SCHEMA_INVALID.
  then:
  - The API returns canonical error code INPUT_SCHEMA_INVALID with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Billing Manager
    operationIds:
    - getCreditBalance
    requirements:
    - REQ-BILL-002
    - REQ-CREDIT-003
  expectedEvents: []
  expectedErrorCode: INPUT_SCHEMA_INVALID
