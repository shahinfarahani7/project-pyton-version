apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-068-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-068
  useCaseRef: UseCase/uc-034-resume-after-restart@2.0.0
  mode: failure
  given:
  - Use case UC-034 policy dependencies are active and their hashes are pinned for the request.
  - Actor Worker App is authenticated and has permissions worker.assignments:read.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
