apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-054-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-054
  useCaseRef: UseCase/uc-027-verify-model@2.0.0
  mode: failure
  given:
  - Use case UC-027 policy dependencies are active and their hashes are pinned for the request.
  - Actor Worker App is authenticated and has permissions worker.models:write.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke reportModelInstall with the deterministic precondition that produces MODEL_DIGEST_MISMATCH.
  then:
  - The API returns canonical error code MODEL_DIGEST_MISMATCH with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Worker App
    operationIds:
    - reportModelInstall
    requirements:
    - REQ-MODEL-002
  expectedEvents: []
  expectedErrorCode: MODEL_DIGEST_MISMATCH
