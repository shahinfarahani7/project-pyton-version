apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-084-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-084
  useCaseRef: UseCase/uc-042-quarantine-worker@2.0.0
  mode: failure
  given:
  - Use case UC-042 policy dependencies are active and their hashes are pinned for the request.
  - Actor Fraud Operator is authenticated and has permissions ops.operations:write.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke quarantineWorker with the deterministic precondition that produces WORKER_ALREADY_QUARANTINED.
  then:
  - The API returns canonical error code WORKER_ALREADY_QUARANTINED with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Fraud Operator
    operationIds:
    - quarantineWorker
    requirements:
    - REQ-FRAUD-001
  expectedEvents: []
  expectedErrorCode: WORKER_ALREADY_QUARANTINED
