apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-026-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-026
  useCaseRef: UseCase/uc-013-retry-task@2.0.0
  mode: failure
  given:
  - Use case UC-013 policy dependencies are active and their hashes are pinned for the request.
  - Actor Customer Developer is authenticated and has permissions customer.tasks:write.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke retryTask with the deterministic precondition that produces TASK_REVISION_NOT_RETRYABLE.
  then:
  - The API returns canonical error code TASK_REVISION_NOT_RETRYABLE with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Customer Developer
    operationIds:
    - retryTask
    requirements:
    - REQ-TASK-003
  expectedEvents: []
  expectedErrorCode: TASK_REVISION_NOT_RETRYABLE
