apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-058-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-058
  useCaseRef: UseCase/uc-029-report-assignment-started@2.1.0
  mode: failure
  given:
  - Use case UC-029 policy dependencies are active and their hashes are pinned for the request.
  - Actor Worker App is authenticated and has permissions worker.assignments:write.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke reportAssignmentStarted after the automatic start window expired.
  then:
  - The API returns canonical error code ASSIGNMENT_START_WINDOW_EXPIRED with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Worker App
    operationIds:
    - reportAssignmentStarted
    requirements:
    - REQ-LEASE-002
    - REQ-CONSENT-004
  expectedEvents: []
  expectedErrorCode: ASSIGNMENT_START_WINDOW_EXPIRED
