apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-090-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-090
  useCaseRef: UseCase/uc-045-run-ledger-reconciliation@2.0.0
  mode: failure
  given:
  - Use case UC-045 policy dependencies are active and their hashes are pinned for the request.
  - Actor Finance Operator is authenticated and has permissions ops.finance:reconcile-ledger.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke runLedgerReconciliation with the deterministic precondition that produces RECONCILIATION_ALREADY_RUNNING.
  then:
  - The API returns canonical error code RECONCILIATION_ALREADY_RUNNING with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Finance Operator
    operationIds:
    - runLedgerReconciliation
    requirements:
    - REQ-BILL-004
    - REQ-OBS-004
  expectedEvents: []
  expectedErrorCode: RECONCILIATION_ALREADY_RUNNING
