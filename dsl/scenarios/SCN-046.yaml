  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-046
  useCaseRef: UseCase/uc-023-submit-attestation@2.0.0
  mode: failure
  given:
  - Use case UC-023 policy dependencies are active and their hashes are pinned for the request.
