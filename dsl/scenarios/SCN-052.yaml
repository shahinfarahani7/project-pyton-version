apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-052-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-052
  useCaseRef: UseCase/uc-026-download-model@2.0.0
  mode: failure
  given:
  - Use case UC-026 policy dependencies are active and their hashes are pinned for the request.
  - Actor Worker App is authenticated and has permissions worker.models:read.
