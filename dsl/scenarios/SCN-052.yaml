  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Worker App
    operationIds:
    - getModelManifest
    requirements:
    - REQ-MODEL-001
  expectedEvents: []
  expectedErrorCode: MODEL_NOT_COMPATIBLE
