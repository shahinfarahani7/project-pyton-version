apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-016-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-016
  useCaseRef: UseCase/uc-008-complete-file-upload@2.0.0
  mode: failure
  given:
  - Use case UC-008 policy dependencies are active and their hashes are pinned for the request.
  - Actor Customer Developer is authenticated and has permissions customer.files:write.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke completeFileUpload with the deterministic precondition that produces UPLOAD_INCOMPLETE.
  then:
  - The API returns canonical error code UPLOAD_INCOMPLETE with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Customer Developer
    operationIds:
    - completeFileUpload
    requirements:
    - REQ-FILE-002
  expectedEvents: []
  expectedErrorCode: UPLOAD_INCOMPLETE
