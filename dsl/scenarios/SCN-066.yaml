apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-066-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-066
  useCaseRef: UseCase/uc-033-submit-result@2.0.0
  mode: failure
  given:
  - Use case UC-033 policy dependencies are active and their hashes are pinned for the request.
  - Actor Worker App is authenticated and has permissions worker.assignments:complete, worker.assignments:write.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke createAssignmentResultUploadIntent, completeAssignment with the deterministic precondition that produces ASSIGNMENT_STALE_FENCE.
  then:
  - The API returns canonical error code ASSIGNMENT_STALE_FENCE with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Worker App
    operationIds:
    - createAssignmentResultUploadIntent
    - completeAssignment
    requirements:
    - REQ-VERIFY-002
  expectedEvents: []
  expectedErrorCode: ASSIGNMENT_STALE_FENCE
