  owners:
  - qa
spec:
  id: SCN-103
  useCaseRef: UseCase/uc-052-finalize-task-billing@2.0.0
  mode: success
  given:
  - Use case UC-052 policy dependencies are active and their hashes are pinned for the request.
  - Actor Billing Service is authenticated and has permissions ops.finance:finalize-usage.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke finalizeTaskUsage with a schema-valid request and a new Idempotency-Key.
  then:
  - The operation commits with concurrency strategy unique_constraints_plus_idempotency.
  - 'Exactly these entities are written: usage_events, credit_reservations, ledger_transactions, ledger_entries, reward_accruals.'
  - 'Exactly these canonical events are inserted into the outbox: task.usage.charged, worker.reward.pending.'
  - The response, audit evidence, trace identifiers and financial effects match the UseCase implementation contract.
