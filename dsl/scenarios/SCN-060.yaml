  owners:
  - qa
spec:
  id: SCN-060
  useCaseRef: UseCase/uc-030-report-assignment-unavailable@2.1.0
  mode: failure
  given:
  - Use case UC-030 policy dependencies are active and their hashes are pinned for the request.
