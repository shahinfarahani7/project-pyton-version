apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-082-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-082
  useCaseRef: UseCase/uc-041-revoke-model@2.0.0
  mode: failure
  given:
  - Use case UC-041 policy dependencies are active and their hashes are pinned for the request.
  - Actor Security Operator is authenticated and has permissions ops.models:revoke.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke revokeModel with the deterministic precondition that produces MODEL_HAS_ACTIVE_ASSIGNMENTS.
  then:
  - The API returns canonical error code MODEL_HAS_ACTIVE_ASSIGNMENTS with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Security Operator
    operationIds:
    - revokeModel
    requirements:
    - REQ-MODEL-004
  expectedEvents: []
  expectedErrorCode: MODEL_HAS_ACTIVE_ASSIGNMENTS
