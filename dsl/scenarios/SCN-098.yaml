    actor: Operations Agent
    operationIds:
    - activateEconomyKillSwitch
    - deactivateEconomyKillSwitch
    requirements:
    - REQ-OBS-001
    - REQ-POLICY-004
    - REQ-REWARD-004
  expectedEvents: []
