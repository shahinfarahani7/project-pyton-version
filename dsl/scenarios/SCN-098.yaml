apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-098-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-098
  useCaseRef: UseCase/uc-049-activate-economy-kill-switch@2.0.0
  mode: failure
  given:
  - Use case UC-049 policy dependencies are active and their hashes are pinned for the request.
  - Actor Operations Agent is authenticated and has permissions ops.operations:write.
