apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-056-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-056
  useCaseRef: UseCase/uc-028-receive-auto-assigned-lease@2.1.0
  mode: failure
  given:
  - Use case UC-028 policy dependencies are active and their hashes are pinned for the request.
  - Actor Worker App is authenticated and has permissions worker.assignments:read.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke getNextAssignment for a device that is no longer eligible.
  then:
  - The API returns canonical error code WORKER_NOT_ELIGIBLE with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Worker App
    operationIds:
    - getNextAssignment
    requirements:
    - REQ-LEASE-001
  expectedEvents: []
  expectedErrorCode: WORKER_NOT_ELIGIBLE
