apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-076-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-076
  useCaseRef: UseCase/uc-038-activate-policy@2.0.0
  mode: failure
  given:
  - Use case UC-038 policy dependencies are active and their hashes are pinned for the request.
  - Actor Operations Agent is authenticated and has permissions ops.policies:activate.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke activatePolicy with the deterministic precondition that produces POLICY_APPROVAL_MISSING.
  then:
  - The API returns canonical error code POLICY_APPROVAL_MISSING with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Operations Agent
    operationIds:
    - activatePolicy
    requirements:
    - REQ-POLICY-002
  expectedEvents: []
  expectedErrorCode: POLICY_APPROVAL_MISSING
