apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-030-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-030
  useCaseRef: UseCase/uc-015-download-result@2.0.0
  mode: failure
  given:
  - Use case UC-015 policy dependencies are active and their hashes are pinned for the request.
  - Actor Customer Developer is authenticated and has permissions customer.results:read.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
