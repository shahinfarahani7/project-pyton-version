  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-086
  useCaseRef: UseCase/uc-043-review-worker-appeal@2.0.0
  mode: failure
  given:
  - Use case UC-043 policy dependencies are active and their hashes are pinned for the request.
