apiVersion: edgemint.io/v1
kind: Scenario
metadata:
  name: scn-104-failure
  version: 2.0.0
  status: active
  owners:
  - qa
spec:
  id: SCN-104
  useCaseRef: UseCase/uc-052-finalize-task-billing@2.0.0
  mode: failure
  given:
  - Use case UC-052 policy dependencies are active and their hashes are pinned for the request.
  - Actor Billing Service is authenticated and has permissions ops.finance:finalize-usage.
  - Referenced tenant/worker resources, versions and input digests match the declared preconditions.
  when:
  - Invoke finalizeTaskUsage with the deterministic precondition that produces VERIFICATION_NOT_FINAL.
  then:
  - The API returns canonical error code VERIFICATION_NOT_FINAL with its ErrorCatalog HTTP status and retryable flag.
  - The transaction performs no unauthorized domain, billing, reward, token or ledger side effect.
  - The failed command remains auditable by requestId and traceId without logging protected payload data.
  fixtures:
    actor: Billing Service
    operationIds:
    - finalizeTaskUsage
    requirements:
    - REQ-REWARD-002
    - REQ-CREDIT-004
    - REQ-QUOTE-004
  expectedEvents: []
  expectedErrorCode: VERIFICATION_NOT_FINAL
