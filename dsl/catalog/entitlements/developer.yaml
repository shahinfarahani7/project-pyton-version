apiVersion: edgemint.io/v1
kind: EntitlementPolicy
metadata:
  name: developer-entitlements-v2
  version: 2.0.0
  status: active
  owners:
  - product
  - billing
spec:
  plan: developer
  limits:
    concurrentLeases: 5
    monthlyIncludedCreditMicros: 2000000000
    logRetentionDays: 7
    apiRequestsPerMinute: 100
  features:
    rbac: false
    sso: false
    dedicatedPool: false
    customKeys: false
    humanReview: false
  priceMultiplierBps: 11500
  hardLimitBehavior: reject_with_upgrade_required
