apiVersion: edgemint.io/v1
kind: TaskType
metadata:
  name: document-extract
  version: 2.0.0
  status: active
  description: Production task contract for document.extract
  labels:
    domain: document
  owners:
  - product
  - platform
spec:
  code: document.extract
  lifecycle: commercial-candidate
  billing:
    measure: document
    quantum: 1
    rounding: ceil
    minimumQuanta: 1
  inputSchema:
    type: object
    required:
    - assetRef
    - options
    properties:
      assetRef:
        type: string
        pattern: ^file_[A-Za-z0-9]+$
      options:
        type: object
    additionalProperties: false
  outputSchema:
    type: object
    required:
    - status
    - data
    - metrics
    properties:
      status:
        enum:
        - succeeded
        - partial
        - failed
      data:
        type: object
        required:
        - vendor
        - total
        - currency
        properties:
          vendor:
            type: string
          total:
            type: number
          currency:
            type: string
      metrics:
        type: object
    additionalProperties: false
  inputLimits:
    maximumBytes: 52428800
    allowedContentTypes:
    - application/pdf
    - image/jpeg
    - image/png
  requiredCapabilities:
    minimumWorkerTier: T2
    attestationRequired: true
    secureNetworkRequired: true
    maximumExecutionSeconds: 600
  modelCandidates:
  - modelRef: ModelProfile/minicpm-v-4.6-q4@2.0.0
    priority: 1
  - modelRef: ModelProfile/gemma-3n-e2b-int4@2.0.0
    priority: 2
  verificationPolicyRef: VerificationPolicy/default-verification-v2@2.0.0
  dataPolicyRef: DataPolicy/confidential-v2@2.0.0
  defaultVerification: verified
  retention:
    inputHours: 24
    resultDays: 30
    workerTemporaryMinutes: 15
  idempotencyScope: workspace+operation+key
  editableAfterSubmit: false
  safety:
    contentPolicy: customer-acceptable-use-v1
    humanReviewAllowed: true
