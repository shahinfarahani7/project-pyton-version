apiVersion: edgemint.io/v1
kind: TaskType
metadata:
  name: catalog-fake-listing
  version: 2.0.0
  status: active
  description: Production flex contract for catalog.fake_listing
  labels:
    domain: flex
    family: qwen_flex
  owners:
  - product
  - platform
spec:
  code: catalog.fake_listing
  lifecycle: commercial-candidate
  billing:
    measure: total_token
    quantum: 1000
    rounding: ceil
    minimumQuanta: 1
  inputSchema:
    type: object
    required:
    - flexInput
    additionalProperties: false
    properties:
      flexInput:
        type: object
        required:
        - listing
        properties:
          listing:
            type: object
      options:
        type: object
  outputSchema:
    type: object
    required:
    - status
    - data
    - metrics
    additionalProperties: false
    properties:
      status:
        enum:
        - succeeded
        - partial
        - failed
      data:
        type: object
        required:
        - fake
        - riskScore
        - reasons
        properties:
          fake:
            type: boolean
          riskScore:
            type: number
            minimum: 0
            maximum: 1
          reasons:
            type: array
            items:
              type: string
      metrics:
        type: object
  inputLimits:
    maximumBytes: 1048576
    allowedContentTypes:
    - application/json
  requiredCapabilities:
    minimumWorkerTier: T2
    attestationRequired: true
    secureNetworkRequired: true
    maximumExecutionSeconds: 300
  modelCandidates:
  - modelRef: ModelProfile/qwen2.5-0.5b@2.0.0
    priority: 1
  verificationPolicyRef: VerificationPolicy/default-verification-v2@2.0.0
  dataPolicyRef: DataPolicy/confidential-v2@2.0.0
  defaultVerification: standard
  retention:
    inputHours: 24
    resultDays: 30
    workerTemporaryMinutes: 15
  idempotencyScope: workspace+operation+key
  editableAfterSubmit: false
  safety:
    contentPolicy: customer-acceptable-use-v1
    humanReviewAllowed: true
