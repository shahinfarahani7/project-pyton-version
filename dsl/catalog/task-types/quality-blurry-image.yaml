apiVersion: edgemint.io/v1
kind: TaskType
metadata:
  name: quality-blurry-image
  version: 2.0.0
  status: active
  description: Lightweight quality task for quality.blurry_image
  labels:
    domain: vision
    family: lightweight
    visionCategory: image_classifier
    qualityCategory: blur_detection
    runtimeClass: image_classifier
  owners:
  - product
  - platform
spec:
  code: quality.blurry_image
  lifecycle: commercial-candidate
  billing:
    measure: image
    quantum: 1
    rounding: ceil
    minimumQuanta: 1
  inputSchema:
    type: object
    required:
    - assetRef
    additionalProperties: false
    properties:
      assetRef:
        type: string
        pattern: ^file_[A-Za-z0-9]+$
      options:
        type: object
  outputSchema:
    type: object
    required:
    - status
    - data
    - metrics
    additionalProperties: false
    properties:
      status:
        enum:
        - succeeded
        - partial
        - failed
      data:
        type: object
        required:
        - laplacianVariance
        - blurry
        - threshold
        properties:
          laplacianVariance:
            type: number
            minimum: 0
          blurry:
            type: boolean
          threshold:
            type: number
            minimum: 0
      metrics:
        type: object
  inputLimits:
    maximumBytes: 20971520
    allowedContentTypes:
    - image/jpeg
    - image/png
    - image/webp
  requiredCapabilities:
    minimumWorkerTier: T2
    attestationRequired: true
    secureNetworkRequired: true
    maximumExecutionSeconds: 60
  modelCandidates: []
  verificationPolicyRef: VerificationPolicy/default-verification-v2@2.0.0
  dataPolicyRef: DataPolicy/confidential-v2@2.0.0
  defaultVerification: standard
  retention:
    inputHours: 24
    resultDays: 30
    workerTemporaryMinutes: 15
  idempotencyScope: workspace+operation+key
  editableAfterSubmit: false
  safety:
    contentPolicy: customer-acceptable-use-v1
    humanReviewAllowed: true
