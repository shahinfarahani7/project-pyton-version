apiVersion: edgemint.io/v1
kind: TaskType
metadata:
  name: extract-order-number
  version: 2.0.0
  status: active
  description: Production task contract for extract.order_number (Qwen OCR extract)
  labels:
    domain: document
    family: qwen_ocr
  owners:
  - product
  - platform
spec:
  code: extract.order_number
  lifecycle: commercial-candidate
  billing:
    measure: total_token
    quantum: 1000
    rounding: ceil
    minimumQuanta: 1
  inputSchema:
    type: object
    required:
    - assetRef
    properties:
      assetRef:
        type: string
      options:
        type: object
    additionalProperties: false
  outputSchema:
    type: object
    required:
    - status
    - data
    - metrics
    properties:
      status:
        enum:
        - succeeded
        - partial
        - failed
      data:
        type: object
        required:
        - orderNumber
        - confidence
        - evidence
        properties:
          orderNumber:
            type: string
          confidence:
            type: number
            minimum: 0
            maximum: 1
          evidence:
            type: string
      metrics:
        type: object
    additionalProperties: false
  inputLimits:
    maximumBytes: 52428800
    allowedContentTypes:
    - application/pdf
    - image/jpeg
    - image/png
  requiredCapabilities:
    minimumWorkerTier: T2
    attestationRequired: true
    secureNetworkRequired: true
    maximumExecutionSeconds: 600
  modelCandidates:
  - modelRef: ModelProfile/qwen2.5-0.5b@2.0.0
    priority: 1
  verificationPolicyRef: VerificationPolicy/default-verification-v2@2.0.0
  dataPolicyRef: DataPolicy/confidential-v2@2.0.0
  defaultVerification: standard
  retention:
    inputHours: 24
    resultDays: 30
    workerTemporaryMinutes: 15
  idempotencyScope: workspace+operation+key
  editableAfterSubmit: false
  safety:
    contentPolicy: customer-acceptable-use-v1
    humanReviewAllowed: true
