apiVersion: edgemint.io/v1
kind: TokenPolicy
metadata:
  name: offchain-beta
  version: 2.0.0
  status: active
  owners:
  - legal
  - product
spec:
  mode: offchain-beta
  utility:
  - cosmetics
  - worker_level
  - api_discount
  claimPolicyRef: ClaimPolicy/edge-claim-v2@2.0.0
  claimEnabled: false
  activationGates: []
  prohibitions:
  - guaranteed_return
  - guaranteed_price
  - investment_promise
  - unlimited_passive_minting
  - chance_based_real_value_reward
  storePresentation:
    describeAs: edge AI worker rewards
    forbiddenTerms:
    - crypto mining
    - passive crypto miner
    - guaranteed income
