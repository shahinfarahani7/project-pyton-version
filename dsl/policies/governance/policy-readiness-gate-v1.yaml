version: "1.0.0"
name: policy-readiness-gate-v1
description: >
  Policy readiness activation gate, dependency evidence checks and mixed-version rollout (Architecture v2 §0.1, §3, §65–70, §73–75, A23/T23).

architectureSections: ["0.1", "3", "65", "66", "67", "68", "69", "70", "73", "74", "75"]

activationGate:
  failClosedOnMissingValues: true
  requirePolicyReadinessRecord: true
  blockPartialPolicyAreas: true
  explicitZeroMeaningfulOnly: true
  productionActivationStatus: CLOSED_UNTIL_EVIDENCE

policyReadinessRecord:
  requiredFields:
    - architectureVersion
    - policyVersionHash
    - runtimeProfileScope
    - responsibleOwner
    - values
    - evidence
    - compatibility
    - featureFlags
  storageTable: public.policy_readiness_records

dependencyGates:
  requirePinnedCheckoutEvidence: true
  requirePathInventoryForSection3: true
  requireArchitectureVersionMatch: true
  blockEnablementWhenEvidenceMissing: true

mixedVersionRollout:
  allowSimultaneousMinorVersions: false
  requireCompatibilityMatrix: true
  maxSkewWorkerServerMinor: 0
  rollbackBeforeForwardAdoption: true
  deduplicateOwnershipOnRestore: true
  supportedPairs:
    - serverArchitectureVersion: "2.0"
      workerArchitectureVersion: "2.0"
      workerAppMinBuild: 1
      workerAppMaxBuild: null

storageRestore:
  requireOwnershipDedupRecovery: true
  forbidDestructiveDowngrade: true
  forwardCompatibleMigrationsOnly: true

t23Scenarios:
  - id: missing_policy_evidence
    description: Enable path with missing §73 values is blocked fail-closed
  - id: mixed_version_rollout
    description: Incompatible worker/server pair rejected; compatible pair admitted
  - id: storage_restore_dedup
    description: Restore recovers ownership/dedup without destructive downgrade
