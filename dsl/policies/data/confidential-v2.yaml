apiVersion: edgemint.io/v1
kind: DataPolicy
metadata:
  name: confidential-v2
  version: 2.0.0
  status: active
  owners:
  - security
  - privacy
spec:
  classification: confidential
  retention:
    inputHours: 24
    resultDays: 90
    auditDays: 2555
    workerTemporaryMinutes: 15
  encryption:
    inTransitMinimum: TLS1.2
    atRest: managed-kms
    customerManagedKeySupported: true
    workerEnvelopeEncryptionRequired: true
  processing:
    allowedExecutionPolicies:
    - edge_only
    - edge_preferred
    - fastest_available
    - private_pool_only
    regionEnforcement: true
  deletion:
    automatic: true
    legalHoldSupported: true
    workerSecureCleanupRequired: true
    deletionEvidenceRequired: false
