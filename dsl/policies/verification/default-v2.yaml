apiVersion: edgemint.io/v1
kind: VerificationPolicy
metadata:
  name: default-verification-v2
  version: 2.0.0
  status: active
  owners:
  - ml
  - quality
  - finance
spec:
  profiles:
    document.ocr:
      requiredSteps:
      - schema
      - artifact_checksum
      - worker_signature
      - business_rules
      confidence:
        minimumMilli: 820
        automaticAcceptMilli: 960
      consensus:
        requiredFor:
        - consensus
        - enterprise
        minimumWorkers: 3
        similarityMetric: task_specific
        minimumSimilarityMilli: 910
      failureOutcome: retry_then_escalate
