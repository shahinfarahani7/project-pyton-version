  outcomes:
  - accepted
  - accepted_with_warning
  - retry
  - escalate
  - rejected
  maximumAutomaticRetries: 2
  humanReviewQueue: restricted_access
  billingEffects:
    platformFailure: release_full
    customerInputFailure: charge_validation_if_configured
    workerInvalidResult: no_reward
    validWorkerPlatformFailure: pay_worker
  evidenceRetentionDays: 365
