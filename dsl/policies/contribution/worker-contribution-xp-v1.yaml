apiVersion: edgemint.io/v1
kind: ContributionXpPolicy
metadata:
  name: worker-contribution-xp-v1
  version: 1.0.0
  status: active
  owners:
  - worker-economy
  description: >-
    Contribution XP, participation levels and XP boost. XP is not money, does not change
    task routing, trust score, or worker EUR rewards, and is awarded only from accepted
    result candidates with a reward entitlement.
spec:
  unit: CENTI_XP
  baseXp: 10
  xpPerAcceptedMinute: 2
  # Caps copied from dsl/catalog/resource-envelopes/*.yaml estimatedDurationMs.
  # A task type without an entry earns base XP only (TIME_COMPONENT_UNAVAILABLE).
  processingCapsMs:
  - taskType: catalog.fake_listing
    capMs: 120000
  - taskType: document.classify
    capMs: 180000
  - taskType: document.extract
    capMs: 240000
  - taskType: document.ocr
    capMs: 120000
  - taskType: document.summarize
    capMs: 240000
  - taskType: image.classify
    capMs: 60000
  - taskType: image.remove_background
    capMs: 120000
  - taskType: text.classify
    capMs: 90000
  - taskType: text.summarize
    capMs: 180000
  levels:
  - id: bronze
    minXp: 0
  - id: silver
    minXp: 500
  - id: gold
    minXp: 2000
  - id: platinum
    minXp: 6000
  boost:
    bonusBps: 2500
    durationHours: 24
    taskQuota: 50
    # Contributor tokens are disabled in GA1 (production/canonical-decisions.yaml spec.token).
    # Purchase stays disabled until a price and a real token wallet both exist.
    priceTokenMinorUnits: null
