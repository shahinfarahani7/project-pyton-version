apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-publishpolicy
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for publishPolicy.
spec:
  operationId: publishPolicy
  api: operations
  method: POST
  path: /policies/{policyKind}/{policyId}:publish
  summary: Publish immutable policy version
  classification: business_use_case
  permissions:
  - ops.policies:publish
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - policy_documents
    domainEvents:
    - policy.published
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-037-publish-policy@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - POLICY_SCHEMA_INVALID
  - POLICY_VERSION_ALREADY_EXISTS
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /policies/{policyKind}/{policyId}:publish
    request: OpenAPI requestBody/parameters for publishPolicy
    response: OpenAPI responses for publishPolicy
    errors: dsl/catalog/errors/error-catalog-v2.yaml
