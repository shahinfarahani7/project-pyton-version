apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-createdevicechallenge
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for createDeviceChallenge.
spec:
  operationId: createDeviceChallenge
  api: worker
  method: POST
  path: /auth/challenges
  summary: Create attestation challenge
  classification: business_use_case
  permissions:
  - worker.registration:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - device_challenges
    domainEvents:
    - worker.registered
    auditRequired: true
  responseStatuses:
  - '201'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-022-register-worker-device@2.0.0
  errorCodes:
  - ATTESTATION_CHALLENGE_RATE_LIMITED
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::POST /auth/challenges
    request: OpenAPI requestBody/parameters for createDeviceChallenge
    response: OpenAPI responses for createDeviceChallenge
    errors: dsl/catalog/errors/error-catalog-v2.yaml
