apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-deletefile
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for deleteFile.
spec:
  operationId: deleteFile
  api: public
  method: DELETE
  path: /files/{fileId}
  summary: Schedule secure deletion
  classification: business_use_case
  permissions:
  - customer.files:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - files
    domainEvents:
    - file.deleted
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-056-delete-customer-payload@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - DELETION_EVIDENCE_FAILED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - LEGAL_HOLD_ACTIVE
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::DELETE /files/{fileId}
    request: OpenAPI requestBody/parameters for deleteFile
    response: OpenAPI responses for deleteFile
    errors: dsl/catalog/errors/error-catalog-v2.yaml
