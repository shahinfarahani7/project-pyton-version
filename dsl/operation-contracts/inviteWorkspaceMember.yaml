apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-inviteworkspacemember
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for inviteWorkspaceMember.
spec:
  operationId: inviteWorkspaceMember
  api: public
  method: POST
  path: /workspaces/{workspaceId}/invitations
  summary: Invite a workspace member
  classification: business_use_case
  permissions:
  - workspace.members:invite
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - workspace_invitations
    domainEvents:
    - workspace.member.invited
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-003-invite-workspace-member@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - INVITATION_ALREADY_PENDING
  - INVITATION_ROLE_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /workspaces/{workspaceId}/invitations
    request: OpenAPI requestBody/parameters for inviteWorkspaceMember
    response: OpenAPI responses for inviteWorkspaceMember
    errors: dsl/catalog/errors/error-catalog-v2.yaml
