apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-createuploadintent
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for createUploadIntent.
spec:
  operationId: createUploadIntent
  api: public
  method: POST
  path: /files/upload-intents
  summary: Create signed upload intent
  classification: business_use_case
  permissions:
  - customer.files:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - file_upload_sessions
    - files
    domainEvents:
    - file.upload_session.created
    auditRequired: true
  responseStatuses:
  - '201'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-007-create-upload-session@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - CONTENT_TYPE_NOT_ALLOWED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - STORAGE_UNAVAILABLE
  - TENANT_RESOURCE_NOT_FOUND
  - UPLOAD_SIZE_INVALID
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /files/upload-intents
    request: OpenAPI requestBody/parameters for createUploadIntent
    response: OpenAPI responses for createUploadIntent
    errors: dsl/catalog/errors/error-catalog-v2.yaml
