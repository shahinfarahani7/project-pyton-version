apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-reportmodelinstall
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for reportModelInstall.
spec:
  operationId: reportModelInstall
  api: worker
  method: POST
  path: /models/{modelVersionId}:report-install
  summary: Report verified model installation
  classification: business_use_case
  permissions:
  - worker.models:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - device_model_installs
    domainEvents:
    - model.installed
    auditRequired: true
  responseStatuses:
  - '200'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-027-verify-model@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - MODEL_DIGEST_MISMATCH
  - MODEL_SIGNATURE_INVALID
  - RUNTIME_ABI_MISMATCH
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::POST /models/{modelVersionId}:report-install
    request: OpenAPI requestBody/parameters for reportModelInstall
    response: OpenAPI responses for reportModelInstall
    errors: dsl/catalog/errors/error-catalog-v2.yaml
