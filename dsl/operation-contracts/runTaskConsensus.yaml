apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-runtaskconsensus
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for runTaskConsensus.
spec:
  operationId: runTaskConsensus
  api: operations
  method: POST
  path: /tasks/{id}:run-consensus
  summary: Run configured consensus verification
  classification: business_use_case
  permissions:
  - ops.verification:run-consensus
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - verification_votes
    domainEvents:
    - task.verification.accepted
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-051-run-consensus@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - CONSENSUS_QUORUM_NOT_REACHED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  - VERIFICATION_DISAGREEMENT
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /tasks/{id}:run-consensus
    request: OpenAPI requestBody/parameters for runTaskConsensus
    response: OpenAPI responses for runTaskConsensus
    errors: dsl/catalog/errors/error-catalog-v2.yaml
