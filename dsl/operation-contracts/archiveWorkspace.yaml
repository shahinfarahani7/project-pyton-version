apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-archiveworkspace
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for archiveWorkspace.
spec:
  operationId: archiveWorkspace
  api: public
  method: DELETE
  path: /workspaces/{workspaceId}
  summary: Archive workspace
  classification: supporting_command
  permissions:
  - customer.workspaces:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - workspaces
    domainEvents: []
    auditRequired: true
  responseStatuses:
  - '204'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs: []
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::DELETE /workspaces/{workspaceId}
    request: OpenAPI requestBody/parameters for archiveWorkspace
    response: OpenAPI responses for archiveWorkspace
    errors: dsl/catalog/errors/error-catalog-v2.yaml
