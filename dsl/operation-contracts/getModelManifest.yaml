apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-getmodelmanifest
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for getModelManifest.
spec:
  operationId: getModelManifest
  api: worker
  method: GET
  path: /models/{modelVersionId}/manifest
  summary: Get signed model artifact manifest
  classification: business_use_case
  permissions:
  - worker.models:read
  idempotency:
    required: false
    scope: not applicable to safe read; Request-Id is tracing only
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: read_only
    isolation: read_only_repeatable_read
    writes: []
    domainEvents: []
    auditRequired: false
  responseStatuses:
  - '200'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-026-download-model@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - DOWNLOAD_POLICY_BLOCKED
  - INPUT_SCHEMA_INVALID
  - INSUFFICIENT_STORAGE
  - MODEL_NOT_COMPATIBLE
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::GET /models/{modelVersionId}/manifest
    request: OpenAPI requestBody/parameters for getModelManifest
    response: OpenAPI responses for getModelManifest
    errors: dsl/catalog/errors/error-catalog-v2.yaml
