apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-renewassignment
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for renewAssignment.
spec:
  operationId: renewAssignment
  api: worker
  method: POST
  path: /assignments/{assignmentId}:renew
  summary: Renew assignment
  classification: business_use_case
  permissions:
  - worker.assignments:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device
    for worker API; MFA operator or mTLS service identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - assignments
    domainEvents:
    - task.assignment.renewed
    - assignment.lease_renewed
    auditRequired: true
  responseStatuses:
  - '200'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-031-renew-execution-lease@2.0.0
  errorCodes:
  - ASSIGNMENT_STALE_FENCE
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - LEASE_EXPIRED
  - LEASE_RENEWAL_SEQUENCE_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::POST /assignments/{assignmentId}:renew
    request: OpenAPI requestBody/parameters for renewAssignment
    response: OpenAPI responses for renewAssignment
    errors: dsl/catalog/errors/error-catalog-v2.yaml
