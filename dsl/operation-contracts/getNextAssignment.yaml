apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-getnextassignment
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for getNextAssignment returning a current auto-assigned lease.
spec:
  operationId: getNextAssignment
  api: worker
  method: GET
  path: /assignments:next
  summary: Long poll for current auto-assigned lease
  classification: business_use_case
  permissions:
  - worker.assignments:read
  idempotency:
    required: false
    scope: not applicable to safe read; Request-Id is tracing only
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: read_only
    isolation: read_only_repeatable_read
    writes: []
    domainEvents: []
    auditRequired: false
  responseStatuses:
  - '200'
  - '204'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-028-receive-auto-assigned-lease@2.1.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  - WORKER_NOT_ELIGIBLE
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::GET /assignments:next
    request: OpenAPI requestBody/parameters for getNextAssignment
    response: OpenAPI responses for getNextAssignment
    errors: dsl/catalog/errors/error-catalog-v2.yaml
