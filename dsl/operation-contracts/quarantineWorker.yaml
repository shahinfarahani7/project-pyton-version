apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-quarantineworker
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for quarantineWorker.
spec:
  operationId: quarantineWorker
  api: operations
  method: POST
  path: /workers/{id}:quarantine
  summary: Quarantine worker
  classification: business_use_case
  permissions:
  - ops.operations:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - fraud_cases
    domainEvents:
    - worker.quarantined
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-042-quarantine-worker@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  - VERSION_CONFLICT
  - WORKER_ALREADY_QUARANTINED
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /workers/{id}:quarantine
    request: OpenAPI requestBody/parameters for quarantineWorker
    response: OpenAPI responses for quarantineWorker
    errors: dsl/catalog/errors/error-catalog-v2.yaml
