apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-resolveclaimtransfer
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for resolveClaimTransfer.
spec:
  operationId: resolveClaimTransfer
  api: operations
  method: POST
  path: /claims/{id}:resolve-transfer
  summary: Resolve ambiguous settlement transfer from provider evidence
  classification: business_use_case
  permissions:
  - ops.claims:resolve-transfer
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - claim_batches
    - reward_claims
    domainEvents:
    - claim.settled
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-048-resolve-ambiguous-claim@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - PROVIDER_RESULT_AMBIGUOUS
  - TENANT_RESOURCE_NOT_FOUND
  - TRANSFER_REFERENCE_MISMATCH
  - VERSION_CONFLICT
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /claims/{id}:resolve-transfer
    request: OpenAPI requestBody/parameters for resolveClaimTransfer
    response: OpenAPI responses for resolveClaimTransfer
    errors: dsl/catalog/errors/error-catalog-v2.yaml
