apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-createapikey
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for createApiKey.
spec:
  operationId: createApiKey
  api: public
  method: POST
  path: /workspaces/{workspaceId}/api-keys
  summary: Create API key
  classification: business_use_case
  permissions:
  - customer.api-keys:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - api_credentials
    domainEvents:
    - api_key.created
    auditRequired: true
  responseStatuses:
  - '201'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-004-create-api-key@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /workspaces/{workspaceId}/api-keys
    request: OpenAPI requestBody/parameters for createApiKey
    response: OpenAPI responses for createApiKey
    errors: dsl/catalog/errors/error-catalog-v2.yaml
