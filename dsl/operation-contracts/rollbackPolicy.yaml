apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-rollbackpolicy
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for rollbackPolicy.
spec:
  operationId: rollbackPolicy
  api: operations
  method: POST
  path: /policies/{policyKind}/{policyId}:rollback
  summary: Rollback active policy to approved version
  classification: business_use_case
  permissions:
  - ops.policies:rollback
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - policy_activations
    domainEvents:
    - policy.activated
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-039-rollback-policy@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - POLICY_DEPENDENCY_CONFLICT
  - POLICY_ROLLBACK_TARGET_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  - VERSION_CONFLICT
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /policies/{policyKind}/{policyId}:rollback
    request: OpenAPI requestBody/parameters for rollbackPolicy
    response: OpenAPI responses for rollbackPolicy
    errors: dsl/catalog/errors/error-catalog-v2.yaml
