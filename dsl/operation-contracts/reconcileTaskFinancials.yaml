apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-reconciletaskfinancials
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for reconcileTaskFinancials.
spec:
  operationId: reconcileTaskFinancials
  api: operations
  method: POST
  path: /tasks/{id}:reconcile-financials
  summary: Reconcile task reservations charges rewards and releases
  classification: business_use_case
  permissions:
  - ops.finance:reconcile-task
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - credit_reservations
    - ledger_entries
    - ledger_transactions
    - reward_accruals
    domainEvents:
    - ledger.reconciled
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-044-reconcile-task-financials@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - LEDGER_EVIDENCE_INCOMPLETE
  - LEDGER_INVARIANT_FAILED
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /tasks/{id}:reconcile-financials
    request: OpenAPI requestBody/parameters for reconcileTaskFinancials
    response: OpenAPI responses for reconcileTaskFinancials
    errors: dsl/catalog/errors/error-catalog-v2.yaml
