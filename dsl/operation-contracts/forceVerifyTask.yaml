apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-forceverifytask
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for forceVerifyTask.
spec:
  operationId: forceVerifyTask
  api: operations
  method: POST
  path: /tasks/{id}:force-verify
  summary: Force Verify task
  classification: business_use_case
  permissions:
  - ops.operations:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - verifications
    domainEvents:
    - task.verification.accepted
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-050-verify-ocr-result@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  - VERIFICATION_DISAGREEMENT
  - VERIFICATION_POLICY_NOT_ACTIVE
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /tasks/{id}:force-verify
    request: OpenAPI requestBody/parameters for forceVerifyTask
    response: OpenAPI responses for forceVerifyTask
    errors: dsl/catalog/errors/error-catalog-v2.yaml
