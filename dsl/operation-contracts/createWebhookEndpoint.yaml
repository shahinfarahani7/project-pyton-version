apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-createwebhookendpoint
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for createWebhookEndpoint.
spec:
  operationId: createWebhookEndpoint
  api: public
  method: POST
  path: /webhook-endpoints
  summary: Create webhook endpoint
  classification: business_use_case
  permissions:
  - customer.webhooks:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - webhook_endpoints
    domainEvents:
    - webhook.endpoint.created
    auditRequired: true
  responseStatuses:
  - '201'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-016-create-webhook@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /webhook-endpoints
    request: OpenAPI requestBody/parameters for createWebhookEndpoint
    response: OpenAPI responses for createWebhookEndpoint
    errors: dsl/catalog/errors/error-catalog-v2.yaml
