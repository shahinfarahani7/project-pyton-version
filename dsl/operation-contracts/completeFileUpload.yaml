apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-completefileupload
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for completeFileUpload.
spec:
  operationId: completeFileUpload
  api: public
  method: POST
  path: /files/{fileId}:complete
  summary: Finalize upload and start scan
  classification: business_use_case
  permissions:
  - customer.files:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - files
    domainEvents:
    - file.ready
    auditRequired: true
  responseStatuses:
  - '200'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-008-complete-file-upload@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - FILE_DIGEST_MISMATCH
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - MALWARE_DETECTED
  - TENANT_RESOURCE_NOT_FOUND
  - UPLOAD_INCOMPLETE
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /files/{fileId}:complete
    request: OpenAPI requestBody/parameters for completeFileUpload
    response: OpenAPI responses for completeFileUpload
    errors: dsl/catalog/errors/error-catalog-v2.yaml
