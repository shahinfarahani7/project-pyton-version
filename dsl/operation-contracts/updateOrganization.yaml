apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-updateorganization
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for updateOrganization.
spec:
  operationId: updateOrganization
  api: public
  method: PATCH
  path: /organizations/{organizationId}
  summary: Update organization
  classification: supporting_command
  permissions:
  - customer.organizations:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - organizations
    domainEvents: []
    auditRequired: true
  responseStatuses:
  - '200'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs: []
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::PATCH /organizations/{organizationId}
    request: OpenAPI requestBody/parameters for updateOrganization
    response: OpenAPI responses for updateOrganization
    errors: dsl/catalog/errors/error-catalog-v2.yaml
