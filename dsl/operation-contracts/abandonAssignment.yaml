  api: worker
  method: POST
  path: /assignments/{assignmentId}:abandon
  summary: Abandon assignment
  classification: supporting_command
  permissions:
  - worker.assignments:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
