  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs: []
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::POST /assignments/{assignmentId}:abandon
    request: OpenAPI requestBody/parameters for abandonAssignment
    response: OpenAPI responses for abandonAssignment
    errors: dsl/catalog/errors/error-catalog-v2.yaml
