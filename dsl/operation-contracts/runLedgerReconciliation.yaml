apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-runledgerreconciliation
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for runLedgerReconciliation.
spec:
  operationId: runLedgerReconciliation
  api: operations
  method: POST
  path: /reconciliations
  summary: Start double-entry ledger reconciliation
  classification: business_use_case
  permissions:
  - ops.finance:reconcile-ledger
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - ledger_entries
    - ledger_transactions
    - reconciliation_runs
    domainEvents:
    - ledger.reconciliation.completed
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-045-run-ledger-reconciliation@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - LEDGER_IMBALANCE_DETECTED
  - RECONCILIATION_ALREADY_RUNNING
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /reconciliations
    request: OpenAPI requestBody/parameters for runLedgerReconciliation
    response: OpenAPI responses for runLedgerReconciliation
    errors: dsl/catalog/errors/error-catalog-v2.yaml
