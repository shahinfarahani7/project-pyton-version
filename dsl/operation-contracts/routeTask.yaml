apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-routetask
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for routeTask.
spec:
  operationId: routeTask
  api: operations
  method: POST
  path: /tasks/{id}:route
  summary: Route task using active routing policy and quote constraints
  classification: business_use_case
  permissions:
  - ops.routing:route-task
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - assignments
    - task_attempts
    - tasks
    domainEvents:
    - task.fallback.cloud
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-060-cloud-fallback@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - CLOUD_BUDGET_EXCEEDED
  - EDGE_CAPACITY_UNAVAILABLE
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - REGION_POLICY_BLOCKED
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /tasks/{id}:route
    request: OpenAPI requestBody/parameters for routeTask
    response: OpenAPI responses for routeTask
    errors: dsl/catalog/errors/error-catalog-v2.yaml
