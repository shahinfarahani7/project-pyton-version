  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs: []
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /webhook-endpoints/{endpointId}:disable
    request: OpenAPI requestBody/parameters for disableWebhookEndpoint
    response: OpenAPI responses for disableWebhookEndpoint
    errors: dsl/catalog/errors/error-catalog-v2.yaml
