apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-getusage
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for getUsage.
spec:
  operationId: getUsage
  api: public
  method: GET
  path: /usage
  summary: Get metered usage
  classification: business_use_case
  permissions:
  - customer.usage:read
  idempotency:
    required: false
    scope: not applicable to safe read; Request-Id is tracing only
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: read_only
    isolation: read_only_repeatable_read
    writes: []
    domainEvents: []
    auditRequired: false
  responseStatuses:
  - '200'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-019-review-usage@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::GET /usage
    request: OpenAPI requestBody/parameters for getUsage
    response: OpenAPI responses for getUsage
    errors: dsl/catalog/errors/error-catalog-v2.yaml
