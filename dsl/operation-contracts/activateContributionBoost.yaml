apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-activatecontributionboost
  version: 1.0.0
  status: active
  owners:
  - worker-economy
  description: Activates one 24-hour / 50-task contribution XP boost after a committed contributor-token debit.
    Contributor tokens are disabled in GA1, so this operation currently returns a Problem and activates nothing.
spec:
  operationId: activateContributionBoost
  api: worker
  method: POST
  path: /worker-contribution/boosts
  summary: Activate a contribution XP boost by debiting contributor tokens
  classification: supporting_command
  permissions:
  - worker.contribution:write
  idempotency:
    required: true
    scope: operationId + workerDeviceId + Idempotency-Key; the token debit reuses the same key
  tenantBoundary: attested worker/device for worker API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - worker_contribution_boosts
    domainEvents: []
    auditRequired: true
  responseStatuses:
  - '201'
  - '200'
  - '401'
  - '402'
  - '403'
  - '409'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs: []
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - BOOST_ALREADY_ACTIVE
  - BOOST_PRICE_NOT_CONFIGURED
  - INPUT_SCHEMA_INVALID
  - TOKEN_DEBIT_FAILED
  - TOKEN_WALLET_UNAVAILABLE
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::POST /worker-contribution/boosts
    request: OpenAPI requestBody/parameters for activateContributionBoost
    response: OpenAPI responses for activateContributionBoost
    errors: dsl/catalog/errors/error-catalog-v2.yaml
