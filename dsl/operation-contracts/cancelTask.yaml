apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-canceltask
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for cancelTask.
spec:
  operationId: cancelTask
  api: public
  method: POST
  path: /tasks/{taskId}:cancel
  summary: Cancel task
  classification: business_use_case
  permissions:
  - customer.tasks:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - credit_reservations
    - tasks
    domainEvents:
    - credit.released
    - task.cancelled
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-012-cancel-task@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TASK_NOT_CANCELLABLE
  - TENANT_RESOURCE_NOT_FOUND
  - VERSION_CONFLICT
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /tasks/{taskId}:cancel
    request: OpenAPI requestBody/parameters for cancelTask
    response: OpenAPI responses for cancelTask
    errors: dsl/catalog/errors/error-catalog-v2.yaml
