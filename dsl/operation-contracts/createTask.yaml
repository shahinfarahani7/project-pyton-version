apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-createtask
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for createTask.
spec:
  operationId: createTask
  api: public
  method: POST
  path: /tasks
  summary: Create and submit task
  classification: business_use_case
  permissions:
  - customer.tasks:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - credit_reservations
    - task_revisions
    - tasks
    domainEvents:
    - credit.reserved
    - task.created
    - task.queued
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-010-submit-task@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - FILE_NOT_READY
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - INSUFFICIENT_CREDIT
  - QUOTE_EXPIRED
  - TASK_TYPE_NOT_ACTIVE
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /tasks
    request: OpenAPI requestBody/parameters for createTask
    response: OpenAPI responses for createTask
    errors: dsl/catalog/errors/error-catalog-v2.yaml
