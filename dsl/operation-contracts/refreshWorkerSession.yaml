apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-refreshworkersession
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for refreshWorkerSession.
spec:
  operationId: refreshWorkerSession
  api: worker
  method: POST
  path: /sessions:refresh
  summary: Rotate worker session token
  classification: supporting_command
  permissions:
  - worker.registration:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - worker_sessions
    domainEvents: []
    auditRequired: true
  responseStatuses:
  - '200'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs: []
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::POST /sessions:refresh
    request: OpenAPI requestBody/parameters for refreshWorkerSession
    response: OpenAPI responses for refreshWorkerSession
    errors: dsl/catalog/errors/error-catalog-v2.yaml
