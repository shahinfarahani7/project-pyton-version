apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-registerworkerdevice
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for registerWorkerDevice.
spec:
  operationId: registerWorkerDevice
  api: worker
  method: POST
  path: /workers/register
  summary: Register attested device
  classification: business_use_case
  permissions:
  - worker.registration:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - worker_devices
    - worker_sessions
    - workers
    domainEvents:
    - worker.attested
    auditRequired: true
  responseStatuses:
  - '201'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-023-submit-attestation@2.0.0
  errorCodes:
  - ATTESTATION_INVALID
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - CHALLENGE_EXPIRED
  - DEVICE_KEY_MISMATCH
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::POST /workers/register
    request: OpenAPI requestBody/parameters for registerWorkerDevice
    response: OpenAPI responses for registerWorkerDevice
    errors: dsl/catalog/errors/error-catalog-v2.yaml
