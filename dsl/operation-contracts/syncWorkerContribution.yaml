apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-syncworkercontribution
  version: 1.0.0
  status: active
  owners:
  - worker-economy
  description: Scores accepted result candidates that have a reward entitlement and are not yet scored, then
    returns contribution XP, participation level and boost status for the authenticated worker device.
    Runs outside the assignment execution path; XP is unique per task run, so repeated calls never award twice.
spec:
  operationId: syncWorkerContribution
  api: worker
  method: POST
  path: /worker-contribution:sync
  summary: Score accepted results and return contribution XP, level and boost status
  classification: supporting_command
  permissions:
  - worker.contribution:write
  idempotency:
    required: true
    scope: XP awards are unique per task run; the Idempotency-Key is tracing only because the result is
      derived entirely from server records
  tenantBoundary: attested worker/device for worker API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - worker_contribution_xp_awards
    - worker_contribution_boosts
    domainEvents: []
    auditRequired: false
  responseStatuses:
  - '200'
  - '401'
  - '403'
  - '429'
  - '500'
  - '503'
  useCaseRefs: []
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  contractSources:
    openapi: contracts/openapi/edgemint-worker-api.yaml::POST /worker-contribution:sync
    request: OpenAPI requestBody/parameters for syncWorkerContribution
    response: OpenAPI responses for syncWorkerContribution
    errors: dsl/catalog/errors/error-catalog-v2.yaml
