apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-activatepolicy
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for activatePolicy.
spec:
  operationId: activatePolicy
  api: operations
  method: POST
  path: /policies/{policyKind}/{policyId}:activate
  summary: Activate published policy version
  classification: business_use_case
  permissions:
  - ops.policies:activate
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - policy_activations
    domainEvents:
    - policy.activated
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-038-activate-policy@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - POLICY_ACTIVATION_CONFLICT
  - POLICY_APPROVAL_MISSING
  - POLICY_HASH_MISMATCH
  - TENANT_RESOURCE_NOT_FOUND
  - VERSION_CONFLICT
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /policies/{policyKind}/{policyId}:activate
    request: OpenAPI requestBody/parameters for activatePolicy
    response: OpenAPI responses for activatePolicy
    errors: dsl/catalog/errors/error-catalog-v2.yaml
