apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-createorganization
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for createOrganization.
spec:
  operationId: createOrganization
  api: public
  method: POST
  path: /organizations
  summary: Create organization
  classification: business_use_case
  permissions:
  - customer.organizations:write
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - organizations
    domainEvents:
    - organization.created
    auditRequired: true
  responseStatuses:
  - '201'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-001-create-organization@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - TENANT_RESOURCE_NOT_FOUND
  contractSources:
    openapi: contracts/openapi/edgemint-public-api.yaml::POST /organizations
    request: OpenAPI requestBody/parameters for createOrganization
    response: OpenAPI responses for createOrganization
    errors: dsl/catalog/errors/error-catalog-v2.yaml
