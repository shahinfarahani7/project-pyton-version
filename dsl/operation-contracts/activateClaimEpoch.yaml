apiVersion: edgemint.io/v1
kind: OperationContract
metadata:
  name: operation-activateclaimepoch
  version: 2.1.0
  status: active
  owners:
  - platform
  description: Normative implementation contract for activateClaimEpoch.
spec:
  operationId: activateClaimEpoch
  api: operations
  method: POST
  path: /claim-epochs/{id}:activate
  summary: Activate approved claim conversion epoch
  classification: business_use_case
  permissions:
  - ops.claims:activate-epoch
  idempotency:
    required: true
    scope: operationId + principalId + tenantOrWorkerScope + Idempotency-Key + canonicalRequestSha256
  tenantBoundary: organization/workspace for customer API; attested worker/device for worker API; MFA operator or mTLS service
    identity for operations API
  transaction:
    mode: command
    isolation: read_committed_with_targeted_row_locks
    writes:
    - token_conversion_epochs
    domainEvents:
    - claim.epoch.activated
    auditRequired: true
  responseStatuses:
  - '202'
  - '400'
  - '401'
  - '403'
  - '404'
  - '409'
  - '412'
  - '422'
  - '429'
  - '500'
  - '503'
  useCaseRefs:
  - UseCase/uc-046-approve-claim-epoch@2.0.0
  errorCodes:
  - AUTH_INVALID_CREDENTIAL
  - AUTH_SCOPE_REQUIRED
  - IDEMPOTENCY_CONFLICT
  - INPUT_SCHEMA_INVALID
  - LEGAL_APPROVAL_MISSING
  - TENANT_RESOURCE_NOT_FOUND
  - TOKEN_CLAIM_NOT_ENABLED
  - TREASURY_CAP_MISSING
  contractSources:
    openapi: contracts/openapi/edgemint-operations-api.yaml::POST /claim-epochs/{id}:activate
    request: OpenAPI requestBody/parameters for activateClaimEpoch
    response: OpenAPI responses for activateClaimEpoch
    errors: dsl/catalog/errors/error-catalog-v2.yaml
