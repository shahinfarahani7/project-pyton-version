apiVersion: edgemint.io/v1
kind: Requirement
metadata:
  name: req-lease-001
  version: 2.0.0
  status: active
  description: Only current fenced auto-assigned lease may execute or complete
  owners:
  - architecture
spec:
  statement: Only the current server-created, fenced auto-assigned lease may execute, checkpoint, renew or complete; stale
    fences are evidence-only and never billable or rewardable.
  priority: must
  acceptance:
  - automated positive test
  - automated negative test
  - audit evidence
  owner: platform
  releaseGate: G1
