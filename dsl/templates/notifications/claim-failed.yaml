apiVersion: edgemint.io/v1
kind: NotificationTemplate
metadata:
  name: claim-failed
  version: 2.0.0
  status: active
  owners:
  - product
  - security
spec:
  channels:
  - email
  - in_app
  localeFallback: en
  subjectKey: notification.claim-failed.subject
  bodyKey: notification.claim-failed.body
  requiredVariables:
  - recipientName
  - eventTime
  - supportReference
  forbiddenVariables:
  - rawApiKey
  - rawPayload
  - fullWalletAddress
  classification: internal
