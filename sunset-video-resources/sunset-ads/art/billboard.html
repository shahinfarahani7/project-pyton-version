<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sunseto billboard: 10,920 × 3,640 mm rooftop board</title>
<link rel="stylesheet" href="kit.css">
<style>
/* A rooftop board on the Japanese サブロク module (910 × 1,820 mm sheets), 6 × 4 sheets = 10,920 × 3,640 mm, 3:1.
   Drawn at 1/10 scale (1 mm here = 10 mm on the board), 5 mm bleed here = 50 mm on the board. */
:root{--tw:1092mm;--th:364mm;--bleed:5mm;--safe:calc(var(--bleed) + 12mm)}
.sheet{background:#2c1d55}
#sky{position:absolute;inset:0;width:100%;height:100%}
h1{position:absolute;left:calc(var(--bleed) + 62mm);top:calc(var(--bleed) + 70mm);
  font-family:var(--serif);font-weight:400;font-size:60mm;line-height:1;letter-spacing:-.022em;color:#fff3e4;white-space:nowrap}
.foot{position:absolute;left:calc(var(--bleed) + 62mm);right:calc(var(--bleed) + 62mm);bottom:calc(var(--bleed) + 36mm);display:flex;align-items:baseline;justify-content:space-between}
.foot .lockup{--F:27mm}
.url{font-family:var(--sans);font-weight:500;font-size:25mm;line-height:1;letter-spacing:-.02em;color:#fff3e4}
</style>
</head>
<body>
<div class="sheet"><div class="trim"></div><div class="safe"></div>
  <canvas id="sky"></canvas>
  <h1>Keep today’s sun for tonight</h1>
  <div class="foot">
    <span data-lockup="cream" data-seal></span>
    <span class="url">sunseto.jp</span>
  </div>
</div>
<script type="module">
import { loadMark, buildLockups, renderSunset, fitCanvas, ready } from './kit.js';
await loadMark();
buildLockups();
const cv = fitCanvas(document.getElementById('sky'));
// sheet 1102 × 374 mm (with bleed): p.y spans ±0.339; the horizon sits 66% down the board
const H = 374 / 1102;
const hz = (0.34 - 0.5) * H * 2;          // horizon 34% up from the bottom edge
const sunR = 64 / 1102 * 2;
renderSunset(cv, {
  hz, sunR, sunX: (0.745 - 0.5) * 2, skyK: 1.45 / (H + (-hz)) , seaK: 2.1, strokes: 46, strokeAmt: 0.32, glow: 0.12,
  grain: 0.018, grainCell: cv.width / 1102 * 0.5,
});
await ready();
</script>
</body>
</html>
