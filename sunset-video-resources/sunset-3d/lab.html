<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset scene lab</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>#lab{min-height:100vh;display:grid;place-items:center}#lab .gl-host{outline:1px dashed rgba(128,128,128,.25)}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/","lenis":"https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.mjs"}}</script>
</head><body>
<!-- lab.html?scene=battery&w=640&h=512&bg=%23F3EADB&dark=0  — one scene host alone, for building and judging a scene -->
<canvas id="gl"></canvas><canvas id="petals-near"></canvas>
<main><section id="lab" data-bg="#F3EADB"><div class="gl-host" id="host"></div></section></main>
<script>
  const q = new URLSearchParams(location.search), h = document.getElementById('host'), s = document.getElementById('lab');
  h.dataset.scene = q.get('scene') || 'hero';
  h.style.width = q.get('w') ? (/\D/.test(q.get('w')) ? q.get('w') : q.get('w') + 'px') : '100vw';
  h.style.height = q.get('h') ? (/\D/.test(q.get('h')) ? q.get('h') : q.get('h') + 'px') : '100vh';
  if (q.get('bg')) s.dataset.bg = q.get('bg');
  if (q.get('dark') === '1') { s.classList.add('dark'); if (!q.get('bg')) s.dataset.bg = '#15111C'; }
  for (const a of (q.get('anchors') || '').split(',').filter(Boolean)) { const d = document.createElement('div'); d.className = 'gl-anchor'; d.dataset.anchor = a; d.innerHTML = '<div class="chip"><div><small>anchor</small><b>' + a + '</b></div></div>'; h.appendChild(d); }
</script>
<script type="module" src="js/main.js"></script>
</body></html>
