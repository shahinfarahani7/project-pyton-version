name: supply-chain
on:
  workflow_call:
permissions: { contents: read, id-token: write, packages: write }
jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13.14' }
      - run: pip install --require-hashes -r tools/requirements.lock
      - run: python tools/generate_ci_artifact_evidence.py
      - run: python tools/verify_release_artifacts.py --evidence-dir evidence/actual
