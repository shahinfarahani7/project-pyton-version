name: edgeMint-ci
on: [push, pull_request]
permissions: { contents: read, id-token: write, security-events: write }
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13.14' }
      - run: pip install --require-hashes -r tools/requirements.lock
      - run: bash tools/validate_all.sh
      - run: git diff --exit-code
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13.14', cache: pip, cache-dependency-path: src/backend/requirements-backend.lock }
      - run: pip install -r src/backend/requirements-backend.lock
      - run: python -m compileall -q src/backend/edgemint src/backend/tests
      - run: PYTHONPATH=src/backend python -m pytest -q src/backend/tests
      - run: python -m ruff check src/backend
      - run: python -m mypy src/backend/edgemint
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run lint:web && npm run test:web && npm run build:web
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.0', channel: stable, cache: true }
      - run: cd src/apps/worker && flutter pub get && flutter analyze && flutter test
