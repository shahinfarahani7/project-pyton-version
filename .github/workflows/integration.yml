name: integration
on:
  workflow_call:
permissions: { contents: read }
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edgemint
          POSTGRES_USER: edgemint
          POSTGRES_PASSWORD: integration-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U edgemint -d edgemint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13.14' }
      - run: pip install --require-hashes -r tools/requirements.lock
      - run: pip install -r src/backend/requirements-backend.lock
      - name: Validate compose ephemeral stack contract
        run: python -c "import yaml; yaml.safe_load(open('compose.yaml'))"
      - run: python tests/integration/stripe_reconciliation.py
      - run: python tests/security/privacy_deletion.py
      - run: PYTHONPATH=src/backend python -m pytest -q src/backend/tests/webhooks src/backend/tests/payments
